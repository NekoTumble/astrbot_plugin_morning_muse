<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>晨光心语</title>
<style>
  /* ── 底色：暖褐夜色。红线：背景不准死白（#fff / #f6f7f9 那种都不行）── */
  :root{
    --bg:#17110e;
    --bg-soft:#1c1512;
    --card:#221a16;
    --line:rgba(255,226,200,.10);
    --line-hi:rgba(255,226,200,.20);
    --text:#f2e7dc;
    --muted:#b7a196;
    --dim:#8a7568;
    --accent:#e8a173;
    --sakura:#dd9cb6;
    --night:#8fb0d6;
    --ok:#93c9a3;
    --warn:#e0b06a;
    --err:#e2907f;
    --r:14px;
  }
  *{box-sizing:border-box}
  html{background:#130e0c}
  body{
    margin:0;padding:24px 22px 40px;color:var(--text);min-height:100vh;
    font:14px/1.65 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 620px at 78% -12%, rgba(232,161,115,.13), transparent 62%),
      radial-gradient(760px 520px at 6% 108%, rgba(143,176,214,.09), transparent 60%),
      linear-gradient(168deg, var(--bg-soft) 0%, var(--bg) 46%, #130e0c 100%);
    background-repeat:no-repeat;background-size:cover;background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;position:relative}

  /* ── 顶栏 ── */
  header{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .mark{
    width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
    background:linear-gradient(150deg,#3a2a21,#251b17 70%);
    border:1px solid var(--line-hi);
    box-shadow:0 6px 18px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,226,200,.08);
  }
  h1{
    font-size:20px;margin:0;letter-spacing:1.6px;font-weight:600;
    background:linear-gradient(100deg,#f6d3b2 0%,#f0b083 42%,#dd9cb6 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
  .sub b{color:var(--text);font-weight:500}
  .spacer{flex:1}
  .personas{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .personas .lab{color:var(--dim);font-size:12px;margin-right:2px}
  .chip{
    font:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;
    background:rgba(255,226,200,.04);color:var(--muted);border:1px solid var(--line);transition:.16s;
  }
  .chip:hover{color:var(--text);border-color:var(--line-hi);background:rgba(255,226,200,.07)}
  .chip.on{
    color:#2a1a11;border-color:transparent;font-weight:600;
    background:linear-gradient(160deg,#f0b083,#dd9265);
    box-shadow:0 4px 14px rgba(232,161,115,.24);
  }
  .iconbtn{
    font:inherit;font-size:12.5px;padding:5px 11px;border-radius:9px;cursor:pointer;
    color:var(--muted);background:rgba(255,226,200,.04);border:1px solid var(--line);transition:.16s;
  }
  .iconbtn:hover{color:var(--text);border-color:var(--line-hi)}

  /* ── 卡片 ── */
  .grid{display:grid;grid-template-columns:1.35fr .95fr;gap:16px;align-items:start}
  .col{display:flex;flex-direction:column;gap:16px}
  .card{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 18px 18px;
    box-shadow:0 10px 26px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,226,200,.045);
  }
  .card > h2{
    display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;
    margin:0 0 14px;letter-spacing:.3px;color:var(--text);
  }
  .card > h2 .ico{font-size:15px}
  .card > h2 .tail{margin-left:auto;font-weight:400;font-size:12px;color:var(--dim)}

  /* ── 今日日程 ── */
  .head-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .head-row h2{margin:0}
  .rewrite{flex:none;text-align:right;margin-left:auto}
  .btn{
    font:inherit;font-size:12.5px;padding:6px 13px;border-radius:9px;cursor:pointer;transition:.16s;
    color:var(--muted);background:rgba(255,226,200,.04);border:1px solid var(--line-hi);white-space:nowrap;
  }
  .btn:hover:not([disabled]){color:var(--text);background:rgba(255,226,200,.09)}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .btn.ghost:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
  .rewrite .hint{color:var(--dim);font-size:11.5px;margin-top:5px;line-height:1.4}
  .confirm{
    display:none;margin:0 0 12px;padding:9px 12px;border-radius:10px;font-size:12.5px;
    background:rgba(224,176,106,.10);border:1px solid rgba(224,176,106,.28);color:#ecd9bb;
    align-items:center;gap:10px;flex-wrap:wrap;
  }
  .confirm.show{display:flex}
  .confirm .grow{flex:1;min-width:150px;line-height:1.5}
  .confirm button{
    font:inherit;font-size:12px;padding:4px 11px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line-hi);background:transparent;color:#ecd9bb;
  }
  .confirm .go{
    background:linear-gradient(160deg,#f0b083,#dd9265);border-color:transparent;
    color:#2a1a11;font-weight:600;
  }

  .banner{
    display:none;margin:0 0 12px;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.55;
  }
  .banner.show{display:block}
  .banner.err{background:rgba(226,144,127,.12);border:1px solid rgba(226,144,127,.32);color:#f0c3b9}
  .banner.ok{background:rgba(147,201,163,.12);border:1px solid rgba(147,201,163,.30);color:#c8e6d2}
  .banner.info{background:rgba(143,176,214,.10);border:1px solid rgba(143,176,214,.26);color:#c3d6ec}

  .ootd{
    display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);
    background:rgba(255,226,200,.035);border:1px solid var(--line);
    border-radius:11px;padding:9px 12px;margin-bottom:14px;
  }
  .ootd .k{color:var(--sakura);flex:none;font-size:12.5px;letter-spacing:.4px}
  .ootd .v{color:#dccfc4}

  .timeline{position:relative;margin:0;padding:0;list-style:none}
  .timeline::before{
    content:"";position:absolute;left:63px;top:10px;bottom:14px;width:1px;
    background:linear-gradient(180deg,transparent,var(--line-hi) 12%,var(--line-hi) 88%,transparent);
  }
  .slot{position:relative;display:grid;grid-template-columns:52px 24px 1fr;gap:0 10px;padding:7px 0}
  .slot .t{font-size:12.5px;color:var(--dim);text-align:right;padding-top:2px;white-space:nowrap}
  .slot .dot{
    justify-self:center;width:9px;height:9px;border-radius:50%;margin-top:8px;
    background:#3a2c25;border:1px solid var(--line-hi);position:relative;z-index:1;
  }
  .slot.past .t{color:#6f5c52}
  .slot.past .body{opacity:.62}
  .slot.now .dot{
    background:var(--accent);border-color:transparent;
    box-shadow:0 0 0 4px rgba(232,161,115,.15),0 0 14px rgba(232,161,115,.5);
  }
  .slot.now .body{
    background:linear-gradient(160deg,rgba(232,161,115,.11),rgba(232,161,115,.035));
    border-color:rgba(232,161,115,.28);
  }
  .body{
    border:1px solid transparent;border-radius:11px;padding:8px 12px 9px;
    font-size:13.3px;line-height:1.72;color:#e3d6ca;transition:.2s;
  }
  .body .top{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
  .body .place{
    font-size:11.5px;color:var(--muted);padding:1px 8px;border-radius:999px;
    background:rgba(255,226,200,.055);border:1px solid var(--line);
  }
  .body .nowtag{
    font-size:11px;letter-spacing:.6px;color:#2a1a11;font-weight:600;border-radius:999px;padding:1px 9px;
    background:linear-gradient(160deg,#f2b487,#dd9265);
  }
  .body .txt{color:#ded1c6;white-space:pre-wrap}

  .note{
    margin-top:14px;padding:11px 14px;border-radius:11px;font-size:13px;color:#d9c9bb;
    background:linear-gradient(160deg,rgba(221,156,182,.10),rgba(232,161,115,.05));
    border:1px solid rgba(221,156,182,.18);white-space:pre-wrap;
  }
  .note .k{color:var(--sakura);font-size:12px;letter-spacing:.4px;margin-right:6px}

  /* ── 此刻状态 ── */
  .state-top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .ring{position:relative;width:84px;height:84px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
  .ring .val b{font-size:18px;font-weight:600;color:#f3e2d2}
  .ring .val span{font-size:10.5px;color:var(--dim);letter-spacing:.5px}
  .kvline{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);margin-bottom:2px}
  .kvline b{color:#ecdfd3;font-weight:500}
  .kvline .tag{
    font-size:11.5px;color:var(--warn);background:rgba(224,176,106,.12);border-radius:999px;padding:0 8px;
  }
  .meters{display:grid;gap:9px;margin:2px 0 14px}
  .meter{display:grid;grid-template-columns:56px 1fr 38px;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
  .bar{height:5px;border-radius:999px;background:rgba(255,226,200,.08);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#c98d72,var(--accent))}
  .bar.mood i{background:linear-gradient(90deg,#c98ab0,var(--sakura))}
  .meter .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .quote{
    font-size:13px;color:#e2d3c6;line-height:1.75;padding:10px 13px;border-radius:11px;
    background:rgba(143,176,214,.07);border:1px solid rgba(143,176,214,.16);white-space:pre-wrap;
  }
  .quote .who{display:block;font-size:11.5px;color:var(--night);margin-bottom:3px;letter-spacing:.3px}
  .threads{margin:0;padding:0;list-style:none;display:grid;gap:6px}
  .threads li{
    display:flex;gap:9px;align-items:baseline;font-size:12.8px;color:#d5c6b9;
    padding:6px 11px;border-radius:9px;background:rgba(255,226,200,.032);border:1px solid var(--line);
  }
  .threads li::before{content:"·";color:var(--accent);font-weight:700}
  .sec-label{font-size:11.5px;color:var(--dim);letter-spacing:.6px;margin:16px 0 7px}

  /* ── 插件配置 ── */
  .flags{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}
  .flag{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);
    padding:6px 10px;border-radius:9px;background:rgba(255,226,200,.028);border:1px solid var(--line);
  }
  .flag .led{width:6px;height:6px;border-radius:50%;flex:none;background:#5a4a41}
  .flag.on{color:#dfd2c6}
  .flag.on .led{background:var(--ok);box-shadow:0 0 8px rgba(147,201,163,.65)}
  .flag.off{opacity:.72}
  .flag .extra{margin-left:auto;font-size:11px;color:var(--dim)}
  .rows{display:grid;gap:1px;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .rows .r{
    display:flex;justify-content:space-between;gap:12px;font-size:12.5px;
    padding:8px 12px;background:rgba(255,226,200,.022);
  }
  .rows .r:nth-child(even){background:rgba(255,226,200,.038)}
  .rows .r span:first-child{color:var(--dim)}
  .rows .r span:last-child{color:#e0d3c7;text-align:right;word-break:break-all}
  .ok-dot{color:var(--ok)}
  .bad-dot{color:var(--err)}

  .empty{
    padding:22px 16px;border-radius:11px;text-align:center;color:var(--muted);font-size:13px;
    background:rgba(255,226,200,.028);border:1px dashed var(--line-hi);line-height:1.8;
  }
  .empty b{color:var(--text);font-weight:500}
  .skeleton{
    height:14px;border-radius:7px;margin:9px 0;
    background:linear-gradient(90deg,rgba(255,226,200,.05),rgba(255,226,200,.11),rgba(255,226,200,.05));
    background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;
  }
  @keyframes sk{0%{background-position:0% 0}100%{background-position:-200% 0}}
  .spin{display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (max-width:880px){
    .grid{grid-template-columns:1fr}
    body{padding:18px 14px 34px;background-attachment:scroll}
    .timeline::before{left:55px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M4.2 14.6a8.3 8.3 0 1 0 15.4-2.9 6.6 6.6 0 0 1-8-3.7 6.6 6.6 0 0 1-7.4 6.6Z"
                fill="url(#g1)" stroke="rgba(255,226,200,.35)" stroke-width=".9"/>
          <circle cx="17.6" cy="5.6" r="1.1" fill="#f0b083"/>
          <circle cx="20.4" cy="8.6" r=".7" fill="#dd9cb6"/>
          <defs>
            <linearGradient id="g1" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
              <stop stop-color="#f3c39c"/><stop offset="1" stop-color="#c9825f"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <h1>晨光心语</h1>
        <p class="sub" id="sub-line">读取中…</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="personas" id="personas"></div>
    <button class="iconbtn" id="refreshBtn" title="重新读取（不花钱，只是再取一次数）">↻ 刷新</button>
  </header>

  <div id="global-banner" class="banner err"></div>

  <div class="grid">
    <div class="col">
      <section class="card">
        <div class="head-row">
          <h2><span class="ico">📅</span>今天的日程</h2>
          <div class="rewrite">
            <button class="btn ghost" id="rewriteBtn" disabled>✧ 重写今天的日程</button>
            <div class="hint">会调用一次模型<br>只重写她一个人的</div>
          </div>
        </div>
        <div class="confirm" id="confirm">
          <span class="grow">真的重写吗？会重新叫一次模型，把今天的日程整份换掉（大概要几十秒）。</span>
          <button class="go" id="confirmGo">嗯，重写</button>
          <button id="confirmNo">算了</button>
        </div>
        <div class="banner" id="rewrite-banner"></div>
        <div id="schedule-card">
          <div class="skeleton" style="width:60%"></div>
          <div class="skeleton" style="width:88%"></div>
          <div class="skeleton" style="width:74%"></div>
        </div>
      </section>
    </div>

    <div class="col">
      <section class="card">
        <h2><span class="ico">💭</span>此刻<span class="tail" id="now-clock"></span></h2>
        <div id="status-card">
          <div class="skeleton" style="width:70%"></div>
          <div class="skeleton" style="width:90%"></div>
        </div>
      </section>

      <section class="card">
        <h2><span class="ico">⚙️</span>插件配置<span class="tail">只读</span></h2>
        <div id="config-card">
          <div class="skeleton" style="width:80%"></div>
          <div class="skeleton" style="width:65%"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<script src="/api/plugin/page/bridge-sdk.js"></script>
<script>
(function () {
  "use strict";

  const bridge = window.AstrBotPluginView || window.AstrBotPluginPage || null;
  const state = { persona: "", data: null, busy: false };

  const $ = (id) => document.getElementById(id);
  const esc = (v) =>
    String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  function banner(el, text, kind) {
    el.className = "banner " + (kind || "info") + (text ? " show" : "");
    el.textContent = text || "";
  }

  function timeout(promise, ms, label) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error(label || "请求超时")), ms);
      promise.then(
        (v) => { clearTimeout(timer); resolve(v); },
        (e) => { clearTimeout(timer); reject(e); }
      );
    });
  }

  // ── 渲染：今日日程 ─────────────────────────────────────
  function renderSchedule(sched, cfg) {
    const box = $("schedule-card");
    if (!sched || !sched.exists) {
      const when = (cfg && cfg.schedule_time) || "08:00";
      box.innerHTML =
        '<div class="empty">今天还没有日程。<br>每天 <b>' + esc(when) + '</b> 会自己生成一份；' +
        '想现在就要，点右上角「重写今天的日程」。</div>';
      return;
    }

    let html = "";
    if (sched.outfit) {
      html += '<div class="ootd"><span class="k">OOTD</span><span class="v">' +
        esc(sched.outfit) + "</span></div>";
    }
    html += '<ul class="timeline">';
    (sched.items || []).forEach((it) => {
      const cls = it.is_now ? "now" : (it.is_past ? "past" : "");
      html += '<li class="slot ' + cls + '">' +
        '<div class="t">' + esc(it.emoji) + " " + esc(it.time) + "</div>" +
        '<div class="dot"></div>' +
        '<div class="body"><div class="top">' +
        (it.is_now ? '<span class="nowtag">此刻</span>' : "") +
        (it.place ? '<span class="place">' + esc(it.place) + "</span>" : "") +
        '</div><div class="txt">' + esc(it.activity) + "</div></div></li>";
    });
    html += "</ul>";
    if (sched.note) {
      html += '<div class="note"><span class="k">今天想跟你说</span>' + esc(sched.note) + "</div>";
    }
    box.innerHTML = html;
  }

  // ── 渲染：此刻状态 ─────────────────────────────────────
  function ring(value, label) {
    const pct = Math.max(0, Math.min(1, Number(value) || 0));
    const r = 35, c = 2 * Math.PI * r, off = c * (1 - pct);
    return '<div class="ring"><svg width="84" height="84">' +
      '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="rgba(255,226,200,.09)" stroke-width="6"/>' +
      '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="url(#gE)" stroke-width="6" ' +
      'stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      '<defs><linearGradient id="gE" x1="0" y1="0" x2="84" y2="84" gradientUnits="userSpaceOnUse">' +
      '<stop stop-color="#c98d72"/><stop offset="1" stop-color="#f0b083"/></linearGradient></defs></svg>' +
      '<div class="val"><b>' + Math.round(pct * 100) + "</b><span>" + esc(label) + "</span></div></div>";
  }

  function renderStatus(st) {
    const box = $("status-card");
    const live = st && st.live;

    if (!live) {
      // 状态机没开：退回「日程里记着的状态」，别整块空白
      let html = '<div class="empty">内在状态没开（设置页「内在状态」打开后，这里会有精力、心情和此刻在做的事）。</div>';
      if (st && st.state_summary) {
        html += '<div class="sec-label">今天记下的状态</div>' +
          '<div class="quote">' + esc(st.state_summary) + "</div>";
      }
      if (st && st.open_threads && st.open_threads.length) {
        html += '<div class="sec-label">还没了结的事</div><ul class="threads">' +
          st.open_threads.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul>";
      }
      box.innerHTML = html;
      return;
    }

    // 中文与百分比都由后端 core/view_data.py 的 _display_of() 给好，
    // 页面不再自己翻译状态机的码（否则「park」这种会直接露在界面上）
    const disp = st.live_display || {};
    const energy = (Number(disp.energy) || 0) / 100;
    const mood = (st.state && st.state.mood) || {};
    const valence = typeof mood.valence === "number" ? mood.valence : 0;
    const intensity = typeof mood.intensity === "number" ? mood.intensity
      : (Number(live.mood_intensity) || 0);

    let html = '<div class="state-top">' + ring(energy, "精力") +
      '<div class="info">' +
      '<div class="kvline">在 <b>' + esc(disp.location || "—") + "</b>" +
      (disp.location_desc ? "·" + esc(disp.location_desc) : "") + "</div>" +
      '<div class="kvline">正在 <b>' + esc(disp.activity || "—") + "</b></div>" +
      '<div class="kvline"><span class="tag">' + esc(disp.energy_label || "精力") + "</span>" +
      "心情：" + esc(disp.mood || "—") + "</div>" +
      "</div></div>";

    html += '<div class="meters">' +
      '<div class="meter"><span>愉悦度</span><div class="bar mood"><i style="width:' +
      (Math.max(0, Math.min(1, (valence + 1) / 2)) * 100).toFixed(0) + '%"></i></div>' +
      '<span class="n">' + (valence >= 0 ? "+" : "") + valence.toFixed(2) + "</span></div>" +
      '<div class="meter"><span>情绪强度</span><div class="bar mood"><i style="width:' +
      (Math.max(0, Math.min(1, intensity)) * 100).toFixed(0) + '%"></i></div>' +
      '<span class="n">' + intensity.toFixed(2) + "</span></div>" +
      "</div>";

    if (disp.thought) {
      html += '<div class="quote"><span class="who">她这会儿心里的话</span>' + esc(disp.thought) + "</div>";
    }

    const shares = (st.shares || []).map((s) => s.content).filter(Boolean);
    if (shares.length) {
      html += '<div class="sec-label">最近想说的</div><ul class="threads">' +
        shares.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul>";
    }

    const threads = st.open_threads || [];
    if (threads.length) {
      html += '<div class="sec-label">还没了结的事</div><ul class="threads">' +
        threads.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul>";
    }

    if (st.wake_lag > 0) {
      html += '<div class="sec-label">🛌 昨晚被吵醒 ' + esc(st.night_interrupts) +
        ' 次，今早多睡了 ' + esc(st.wake_lag) + " 分钟</div>";
    }

    box.innerHTML = html;
  }

  // ── 渲染：插件配置 ─────────────────────────────────────
  function renderConfig(cfg) {
    const box = $("config-card");
    const flags = (cfg.switches || []).map((s) =>
      '<div class="flag ' + (s.on ? "on" : "off") + '"><i class="led"></i>' + esc(s.label) +
      (s.extra ? '<span class="extra">' + esc(s.extra) + "</span>" : "") + "</div>"
    ).join("");

    const mine = state.persona;
    const generated = (cfg.generated || {})[mine];
    const at = (cfg.generated_at || {})[mine] || "";
    const genText = generated === "error" ? '<span class="bad-dot">读取失败</span>'
      : generated ? '<span class="ok-dot">已生成' + (at ? " · " + esc(at) : "") + "</span>"
      : '<span class="bad-dot">未生成</span>';

    let rows = "";
    const row = (k, v) => { rows += '<div class="r"><span>' + esc(k) + "</span><span>" + v + "</span></div>"; };
    row("每天几点生成", esc(cfg.schedule_time || "08:00"));
    row("时区", esc(cfg.timezone || ""));
    if (cfg.life_enabled) row("作息", esc(cfg.wake || "?") + " 起 · " + esc(cfg.bedtime || "?") + " 睡");
    row("主模型", esc(cfg.model || "（默认）"));
    row("备用模型", esc(cfg.model_backup || "（回落到对话默认）"));
    row("今日日程", genText);
    if (typeof cfg.warn_count === "number") row("近期告警", String(cfg.warn_count) + " 条");
    if (cfg.holiday) row("今天", esc(cfg.holiday));

    box.innerHTML = '<div class="flags">' + flags + "</div>" + '<div class="rows">' + rows + "</div>";
  }

  function renderPersonas(list) {
    const box = $("personas");
    if (!list || !list.length) { box.innerHTML = ""; return; }
    box.innerHTML = '<span class="lab">看谁的一天</span>' +
      list.map((p) =>
        '<button class="chip' + (p.id === state.persona ? " on" : "") +
        '" data-persona="' + esc(p.id) + '">' + esc(p.id) + "</button>"
      ).join("");
    box.querySelectorAll("button.chip").forEach((b) => {
      b.addEventListener("click", () => {
        if (state.busy || b.dataset.persona === state.persona) return;
        state.persona = b.dataset.persona;
        load();
      });
    });
  }

  function renderAll(data) {
    state.data = data;
    state.persona = data.persona;
    $("sub-line").innerHTML = "<b>" + esc(data.server_date) + "</b> " + esc(data.weekday) +
      "　·　读取于 " + esc(data.server_time) +
      (data.schedule && data.schedule.generated_at ? "　·　今天的日程生成于 " + esc(data.schedule.generated_at) : "");
    $("now-clock").textContent = data.server_time;
    renderPersonas(data.personas);
    renderSchedule(data.schedule, data.config);
    renderStatus(data.status || {});
    renderConfig(data.config || {});
    $("rewriteBtn").disabled = false;
  }

  // ── 取数 ───────────────────────────────────────────────
  async function load() {
    if (!bridge) {
      banner($("global-banner"),
        "取不到数据：这个页面要从 AstrBot 面板里、插件卡片上的「插件页面」打开才对。", "err");
      return;
    }
    banner($("global-banner"), "", "");
    try {
      const params = state.persona ? { persona: state.persona } : {};
      const res = await timeout(bridge.apiGet("view/overview", params), 15000,
        "取数超时（页面可能不是在面板里打开的）");
      const data = res && res.data !== undefined ? res.data : res;
      if (!data || !data.ok) throw new Error((data && data.message) || "后端没返回数据");
      renderAll(data);
    } catch (e) {
      banner($("global-banner"), "读取失败：" + (e && e.message ? e.message : e), "err");
    }
  }

  // ── 重写（唯一会花钱的按钮） ────────────────────────────
  const rewriteBtn = $("rewriteBtn");
  const confirmBar = $("confirm");
  const rewriteBanner = $("rewrite-banner");

  rewriteBtn.addEventListener("click", () => {
    banner(rewriteBanner, "", "");
    confirmBar.classList.add("show");
    rewriteBtn.disabled = true;
  });
  $("confirmNo").addEventListener("click", () => {
    confirmBar.classList.remove("show");
    rewriteBtn.disabled = false;
  });

  $("confirmGo").addEventListener("click", async () => {
    confirmBar.classList.remove("show");
    state.busy = true;
    rewriteBtn.disabled = true;
    rewriteBtn.innerHTML = '<span class="spin">◌</span> 生成中…';
    banner(rewriteBanner, "正在叫模型重写「" + state.persona + "」今天的日程，这一步要几十秒…", "info");
    try {
      const res = await timeout(
        bridge.apiPost("view/rewrite", { persona: state.persona }), 180000,
        "等太久了，先去看一眼日志（/日程日志）"
      );
      const data = res && res.data !== undefined ? res.data : res;
      if (data && data.schedule) renderSchedule(data.schedule, (state.data || {}).config);
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      banner(rewriteBanner, "已重写（" + hh + ":" + mm + "）", "ok");
      // 顺手把状态/配置也拉新的（免费，一次只读）
      await load();
    } catch (e) {
      banner(rewriteBanner,
        "重写失败：" + (e && e.message ? e.message : e) + "（这不是「刷新失败」，是真的没写成）", "err");
    } finally {
      state.busy = false;
      rewriteBtn.disabled = false;
      rewriteBtn.innerHTML = "✧ 重写今天的日程";
    }
  });

  $("refreshBtn").addEventListener("click", load);

  // ── 启动 ───────────────────────────────────────────────
  (async () => {
    if (bridge && bridge.ready) {
      try { await timeout(bridge.ready(), 8000, "no-context"); } catch (e) { /* 老版本没有 ready 也不拦 */ }
    }
    await load();
  })();
})();
</script>
</body>
</html>
